name: Update Card Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update-prices:

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update card prices
        working-directory: python
        run: python update_prices.py

      - name: Save updated prices
        run: |

          python - <<'PY'
          import json
          from datetime import datetime, timezone

          timestamp = datetime.now(timezone.utc).isoformat()

          with open(
              "data/price_update.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  {
                      "lastUpdated": timestamp
                  },
                  file,
                  indent=2
              )

              file.write("\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cards.json data/price_update.json

          git diff --cached --quiet || git commit -m "Update card prices"

          git push
          
      - name: Tell Cloudflare update is complete
        run: |
          curl -f -X POST \
            "https://fallout-price-updater.jaksla-806.workers.dev/complete" \
            -H "Authorization: Bearer ${{ secrets.COMPLETE_TOKEN }}"
