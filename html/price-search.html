<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Fallout MTG Collection | Price Analysis</title>

<link rel="stylesheet" href="../css/terminal.css">

<style>

body{
    overflow-x:hidden;
    overflow-y:auto;
}

.terminal{
    height:auto;
    min-height:100vh;
    overflow:visible;
}


/* PRICE SEARCH */

.path{
    color:var(--terminal-green);
    margin-bottom:25px;
    font-size:14px;
}

h1{
    font-size:24px;
    margin:0 0 5px 0;
    font-weight:bold;
}

.subtitle{
    margin:0 0 25px 0;
}


/* CONTROLS */

.controls{
    border-top:1px solid var(--terminal-green);
    border-bottom:1px solid var(--terminal-green);
    padding:20px 0;
    display:flex;
    flex-wrap:wrap;
    gap:15px 25px;
    align-items:end;
}

.control{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.control label{
    font-size:13px;
    color:var(--terminal-green);
}

.control input,
.control select{
    appearance:none;
    background:#020502;
    color:var(--terminal-green);
    border:1px solid var(--terminal-green);
    padding:9px;
    font-family:"Courier New",monospace;
    font-size:14px;
    outline:none;
    text-shadow:0 0 3px var(--terminal-green);
    box-shadow:0 0 5px var(--terminal-green-glow);
}

.control input{
    width:150px;
}

.control select{
    min-width:150px;
    cursor:pointer;
}

.control input:focus,
.control select:focus{
    box-shadow:0 0 8px var(--terminal-green-glow);
}

.button-row{
    display:flex;
    gap:10px;
}

button{
    background:#020502;
    color:var(--terminal-green);
    border:1px solid var(--terminal-green);
    padding:10px 18px;
    font-family:"Courier New",monospace;
    font-size:14px;
    cursor:pointer;
    text-shadow:0 0 3px var(--terminal-green);
}

button:hover,
button:focus{
    background:var(--terminal-green);
    color:#020502;
    outline:none;
    box-shadow:0 0 8px var(--terminal-green-glow);
    text-shadow:none;
}


/* SEARCH STATUS */

#searchStatus{
    margin:20px 0;
    color:var(--terminal-green);
    min-height:20px;
}


/* CHART */

.chart-container{
    border:1px solid var(--terminal-green);
    padding:20px;
    margin-bottom:25px;
    display:none;
    box-shadow:0 0 5px var(--terminal-green-glow);
}

.chart-title{
    margin-bottom:15px;
    color:var(--terminal-green);
    font-weight:bold;
}

.chart-wrapper{
    width:100%;
    height:400px;
    position:relative;
}

#priceChart{
    width:100% !important;
    height:100% !important;
}


/* RESULTS */

.results-container{
    border-top:1px solid var(--terminal-green);
    padding-top:20px;
}

.results-header{
    margin-bottom:15px;
    color:var(--terminal-green);
    font-weight:bold;
}

.results-table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#020502;
}

th,
td{
    border:1px solid var(--terminal-green);
    padding:9px;
    text-align:left;
    white-space:nowrap;
}

th{
    color:var(--terminal-green);
    background:#071007;
    font-weight:bold;
}

td{
    color:var(--terminal-green);
}

tr:hover td{
    background:rgba(120,255,106,.12);
    color:var(--terminal-green);
}

.price{
    text-align:right;
}

.owned{
    font-weight:bold;
}

.unowned{
    color:var(--terminal-green);
}


/* LINKS */

.links a{
    color:var(--terminal-green);
    margin-right:12px;
}

.links a:hover{
    color:#020502;
    background:var(--terminal-green);
    text-decoration:none;
}


/* NO RESULTS */

.no-results{
    padding:25px;
    border:1px solid var(--terminal-green);
    color:var(--terminal-green);
}


/* FOOTER */

.footer{
    margin-top:30px;
    padding-top:15px;
    border-top:1px solid var(--terminal-green);
}

.exit-button{
    display:inline-block;
    margin-top:12px;
    color:var(--terminal-green);
    text-decoration:none;
    border:1px solid var(--terminal-green);
    padding:9px 15px;
}

.exit-button:hover{
    background:var(--terminal-green);
    color:#020502;
}


/* MOBILE */

@media(max-width:800px){

    .chart-wrapper{
        height:300px;
    }

    .controls{
        flex-direction:column;
        align-items:stretch;
    }

    .control input,
    .control select{
        width:100%;
    }

    .button-row{
        width:100%;
    }

    .button-row button{
        flex:1;
    }

}

</style>
</head>


<body>

<div class="terminal">

    <div class="path">
        C:\FALLOUT\MTG\DATABASE\SEARCH\PRICE_ANALYSIS.EXE
    </div>


    <h1>
        &gt; PRICE ANALYSIS
    </h1>

    <p class="subtitle">
        &gt; SEARCH CARD FINISHES BY MARKET VALUE
    </p>


    <div class="controls">

        <div class="control">

            <label for="minPrice">
                &gt; MINIMUM PRICE
            </label>

            <input
                type="number"
                id="minPrice"
                min="0"
                step="0.01"
                value="0"
            >

        </div>


        <div class="control">

            <label for="maxPrice">
                &gt; MAXIMUM PRICE
            </label>

            <input
                type="number"
                id="maxPrice"
                min="0"
                step="0.01"
                placeholder="NO LIMIT"
            >

        </div>


        <div class="control">

            <label for="ownershipFilter">
                &gt; OWNERSHIP
            </label>

            <select id="ownershipFilter">

                <option value="">
                    ALL
                </option>

                <option value="Owned">
                    OWNED
                </option>

                <option value="Unowned">
                    UNOWNED
                </option>

            </select>

        </div>


        <div class="control">

            <label for="bucketSize">
                &gt; PRICE BUCKET
            </label>

            <input
                type="number"
                id="bucketSize"
                min="0.01"
                step="0.01"
                value="0.10"
            >

        </div>


        <div class="button-row">

            <button
                id="Button"
                type="button"
            >
                &gt; 
            </button>

            <button
                id="clearButton"
                type="button"
            >
                &gt; CLEAR
            </button>

        </div>

    </div>


    <div id="Status">
        &gt; READY
    </div>


    <div
        id="chartContainer"
        class="chart-container"
    >

        <div class="chart-title">
            &gt; PRICE DISTRIBUTION
        </div>

        <div class="chart-wrapper">

            <canvas id="priceChart"></canvas>

        </div>

    </div>


    <div class="results-container">

        <div
            id="resultsHeader"
            class="results-header"
        >
            &gt;  RESULTS
        </div>


        <div
            id="resultsArea"
            class="results-table-wrapper"
        >

            <div class="no-results">
                &gt; NO  PERFORMED
            </div>

        </div>

    </div>


    <div class="footer">

        &gt; PRICE ANALYSIS COMPLETE

        <span class="cursor"></span>

        <br>

        <a
            href="index.html"
            class="exit-button"
            id="exitButton"
        >
            &gt; EXIT TO MAIN MENU
        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script>

let cards = [];

let priceChart = null;


const minPriceInput =
    document.getElementById("minPrice");

const maxPriceInput =
    document.getElementById("maxPrice");

const ownershipFilter =
    document.getElementById("ownershipFilter");

const bucketSizeInput =
    document.getElementById("bucketSize");

const searchButton =
    document.getElementById("searchButton");

const clearButton =
    document.getElementById("clearButton");

const searchStatus =
    document.getElementById("searchStatus");

const resultsHeader =
    document.getElementById("resultsHeader");

const resultsArea =
    document.getElementById("resultsArea");

const chartContainer =
    document.getElementById("chartContainer");

const priceChartCanvas =
    document.getElementById("priceChart");


fetch("../data/cards.json")

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Could not load cards.json. HTTP " +
                response.status
            );

        }

        return response.json();

    })

    .then(data => {

        cards = data;

        searchStatus.textContent =
            "DATABASE LOADED: " +
            cards.length +
            " CARDS";

    })

    .catch(error => {

        searchStatus.textContent =
            "&gt; ERROR: " +
            error.message;

        console.error(error);

    });


function getFinishData(card) {

    return [

        {
            name: "No Foil",

            ownership: card.noFoil,

            price: card.noFoilValue
        },

        {
            name: "Standard Foil",

            ownership: card.standardFoil,

            price: card.standardFoilValue
        },

        {
            name: "Surge Foil",

            ownership: card.surgeFoil,

            price: card.surgeFoilValue
        },

        {
            name: "Rainbow Foil",

            ownership: card.rainbowFoil,

            price: card.rainbowFoilValue
        }

    ];

}


function performSearch() {

    const minPrice =
        parseFloat(
            minPriceInput.value
        ) || 0;


    let maxPrice;

    if (
        maxPriceInput.value === "" ||
        maxPriceInput.value === null
    ) {

        maxPrice = Number.MAX_SAFE_INTEGER;

    } else {

        maxPrice =
            parseFloat(
                maxPriceInput.value
            );

    }


    const ownership =
        ownershipFilter.value;


    const bucketSize =
        parseFloat(
            bucketSizeInput.value
        ) || 0.10;


    if (maxPrice < minPrice) {

        searchStatus.textContent =
            "&gt; ERROR: MAXIMUM PRICE CANNOT BE LESS THAN MINIMUM PRICE";

        return;

    }


    if (bucketSize <= 0) {

        searchStatus.textContent =
            "&gt; ERROR: PRICE BUCKET MUST BE GREATER THAN ZERO";

        return;

    }


    const results = [];

    const histogram = {};


    cards.forEach(card => {

        getFinishData(card).forEach(finish => {

            if (
                finish.ownership ===
                "Not Possible"
            ) {
                return;
            }


            if (
                finish.price === "" ||
                finish.price === null ||
                finish.price === undefined
            ) {
                return;
            }


            const price =
                parseFloat(
                    finish.price
                );


            if (Number.isNaN(price)) {
                return;
            }


            if (
                price < minPrice ||
                price > maxPrice
            ) {
                return;
            }


            if (
                ownership === "Owned" &&
                finish.ownership !== "Owned"
            ) {
                return;
            }


            if (
                ownership === "Unowned" &&
                finish.ownership !== "Unowned"
            ) {
                return;
            }


            results.push({

                card: card,

                finish: finish.name,

                price: price,

                ownership:
                    finish.ownership

            });


            const bucketStart =
                Math.floor(
                    price / bucketSize
                ) * bucketSize;


            const bucketEnd =
                bucketStart + bucketSize;


            const label =
                "$" +
                bucketStart.toFixed(2) +
                " - $" +
                bucketEnd.toFixed(2);


            histogram[label] =
                (
                    histogram[label] || 0
                ) + 1;

        });

    });


    renderResults(results);

    renderChart(
        histogram,
        bucketSize
    );


    searchStatus.textContent =
        "&gt; SEARCH COMPLETE: " +
        results.length +
        " MATCHES";


    resultsHeader.textContent =
        "&gt; SEARCH RESULTS: " +
        results.length;

}


function renderResults(results) {

    if (results.length === 0) {

        resultsArea.innerHTML = `

            <div class="no-results">

                &gt; NO CARDS MATCHED THE SPECIFIED PARAMETERS

            </div>

        `;

        return;

    }


    results.sort((a, b) => {

        if (a.price !== b.price) {

            return a.price - b.price;

        }


        return String(
            a.card.name || ""
        ).localeCompare(
            String(
                b.card.name || ""
            )
        );

    });


    let html = `

        <table>

            <thead>

                <tr>

                    <th>Set</th>

                    <th>Number</th>

                    <th>Variant</th>

                    <th>Name</th>

                    <th>Finish</th>

                    <th>Price</th>

                    <th>Ownership</th>

                    <th>Links</th>

                </tr>

            </thead>

            <tbody>

    `;


    results.forEach(result => {

        const card =
            result.card;


        const ownershipClass =
            result.ownership === "Owned"
                ? "owned"
                : "unowned";


        html += `

            <tr>

                <td>
                    ${escapeHtml(card.set)}
                </td>

                <td>
                    ${escapeHtml(card.number)}
                </td>

                <td>
                    ${escapeHtml(card.variant)}
                </td>

                <td>
                    ${escapeHtml(card.name)}
                </td>

                <td>
                    ${escapeHtml(result.finish)}
                </td>

                <td class="price">
                    $${result.price.toFixed(2)}
                </td>

                <td class="${ownershipClass}">
                    ${escapeHtml(result.ownership)}
                </td>

                <td class="links">

                    ${
                        card.numberLink
                            ? `
                                <a
                                    href="${escapeAttribute(card.numberLink)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    Scryfall
                                </a>
                              `
                            : ""
                    }

                    ${
                        card.nameLink
                            ? `
                                <a
                                    href="${escapeAttribute(card.nameLink)}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    TCGplayer
                                </a>
                              `
                            : ""
                    }

                </td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

    `;


    resultsArea.innerHTML = html;

}

function renderChart(histogram, bucketSize) {

    const entries =
        Object.entries(histogram)
            .sort((a, b) => {

                const numA =
                    parseFloat(
                        a[0].replace("$", "")
                    );

                const numB =
                    parseFloat(
                        b[0].replace("$", "")
                    );

                return numA - numB;

            });


    if (entries.length === 0) {

        chartContainer.style.display =
            "none";

        if (priceChart) {

            priceChart.destroy();

            priceChart = null;

        }

        return;

    }


    chartContainer.style.display =
        "block";


    const labels =
        entries.map(
            entry => entry[0]
        );


    const values =
        entries.map(
            entry => entry[1]
        );


    const highestCount =
        Math.max(...values);


    /*
     * Automatically select a sensible
     * maximum for the Y axis.
     */

    let suggestedMax;


    if (highestCount <= 5) {

        suggestedMax = 5;

    } else if (highestCount <= 10) {

        suggestedMax = 10;

    } else if (highestCount <= 20) {

        suggestedMax = 20;

    } else if (highestCount <= 50) {

        suggestedMax = Math.ceil(
            highestCount / 5
        ) * 5;

    } else if (highestCount <= 100) {

        suggestedMax = Math.ceil(
            highestCount / 10
        ) * 10;

    } else {

        suggestedMax = Math.ceil(
            highestCount / 25
        ) * 25;

    }


    if (priceChart) {

        priceChart.destroy();

    }


    priceChart =
        new Chart(
            priceChartCanvas,
            {

                type: "bar",

                data: {

                    labels: labels,

                    datasets: [

                        {
                    
                            label:
                                "Card Count",
                    
                            data: values,
                    
                            backgroundColor:
                                "#6cff6c",
                    
                            borderColor:
                                "#6cff6c",
                    
                            borderWidth: 1
                    
                        }
                    
                    ]

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    animation: false,

                    scales: {

                        x: {

                            title: {

                                display: true,

                                text:
                                    "Price Range"

                            },

                            ticks: {

                                color:
                                    "#4dcc4d"

                            },

                            grid: {

                                color:
                                    "rgba(76, 204, 76, 0.15)"

                            }

                        },

                        y: {

                            beginAtZero: true,

                            suggestedMax:
                                suggestedMax,

                            ticks: {

                                precision: 0,

                                color:
                                    "#4dcc4d"

                            },

                            grid: {

                                color:
                                    "rgba(76, 204, 76, 0.15)"

                            },

                            title: {

                                display: true,

                                text:
                                    "Card Count"

                            }

                        }

                    },

                    plugins: {

                        legend: {

                            labels: {

                                color:
                                    "#6cff6c"

                            }

                        }

                    }

                }

            }
        );

}


function clearSearch() {

    minPriceInput.value =
        "0";

    maxPriceInput.value =
        "";

    ownershipFilter.value =
        "";

    bucketSizeInput.value =
        "0.10";


    resultsArea.innerHTML = `

        <div class="no-results">

            &gt; NO SEARCH PERFORMED

        </div>

    `;


    resultsHeader.textContent =
        "&gt; SEARCH RESULTS";


    searchStatus.textContent =
        "&gt; READY";


    chartContainer.style.display =
        "none";


    if (priceChart) {

        priceChart.destroy();

        priceChart = null;

    }

}


function escapeHtml(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}


searchButton.addEventListener(
    "click",
    performSearch
);


clearButton.addEventListener(
    "click",
    clearSearch
);


/*
 * Allow Enter to run the search
 * without requiring the mouse.
 */

[
    minPriceInput,
    maxPriceInput,
    bucketSizeInput
].forEach(input => {

    input.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                performSearch();

            }

        }
    );

});


ownershipFilter.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            performSearch();

        }

    }
);

</script>

</body>

</html>
