<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Card Lot Search</title>
<link rel="stylesheet" href="../css/terminal.css">
<style>

body{
    overflow-x:hidden;
    overflow-y:auto
}

.terminal{
    min-height:100vh;
    overflow:visible
}

/* CARD LOT SEARCH */

.header{
    margin-bottom:30px
}

.title{
    font-size:24px;
    font-weight:bold;
    letter-spacing:2px;
    line-height:1.5;
    margin-bottom:2px
}

.path{
    font-size:14px;
    line-height:1.5;
}

/* SECTIONS */

.section{
    border:1px solid var(--terminal-green);
    padding:15px;
    margin-bottom:20px;
    overflow-x:auto;
}

.section-title{
    font-weight:bold;
    margin-bottom:15px;
}

/* INPUTS */

.input-grid{
    display:grid;
    grid-template-columns:
        1fr
        1fr
        1fr
        auto;
    gap:12px;
    align-items:end;
}

label{
    display:block;
    font-size:12px;
    margin-bottom:5px;
}

input,
select{
    width:100%;
    box-sizing:border-box;
    appearance:none;
    background:#020502;
    color:var(--terminal-green);
    border:1px solid var(--terminal-green);
    padding:9px;
    font-family:"Courier New",monospace;
    font-size:14px;
    font-weight:normal;
    outline:none;
    text-shadow:0 0 3px var(--terminal-green);
    box-shadow:0 0 5px var(--terminal-green-glow);
}

input:focus,
select:focus{
    box-shadow:0 0 8px var(--terminal-green-glow);
}

/* BUTTONS */

button{
    background:#020502;
    color:var(--terminal-green);
    border:1px solid var(--terminal-green);
    padding:10px 18px;
    font-family:"Courier New",monospace;
    font-size:14px;
    font-weight:normal;
    cursor:pointer;
    text-shadow:0 0 3px var(--terminal-green);
}

button:hover,
button:focus{
    background:var(--terminal-green);
    color:#020502;
    outline:none;
    box-shadow:0 0 8px var(--terminal-green-glow);
    text-shadow:none;
}

button:disabled{
    opacity:.4;
    cursor:default;
}

/* STATUS */

.status{
    min-height:20px;
    margin-top:15px;
    font-size:13px;
}

/* TABLE */

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

th,
td{
    border-bottom:1px solid rgba(120,255,106,.35);
    padding:9px;
    text-align:left;
    font-size:12px;
    white-space:nowrap;
}

th{
    color:var(--terminal-green);
    border-bottom:2px solid var(--terminal-green);
    background:rgba(120,255,106,.05);
}

td{
    color:var(--terminal-green);
}

tr:hover td{
    background:rgba(120,255,106,.08);
}

/* REMOVE BUTTON */

.remove-button{
    background:transparent;
    border:1px solid var(--terminal-green);
    padding:5px 9px;
    margin:0;
    width:auto;
    font-size:14px;
}

.remove-button:hover{
    background:var(--terminal-green);
    color:#020502;
}

/* TOTAL */

.total{
    margin-top:15px;
    border-top:1px solid var(--terminal-green);
    padding-top:12px;
    font-weight:bold;
}

/* FOOTER */

.exit-button{
    display:inline-block;
    margin-top:15px;
    padding:9px 15px;
    border:1px solid var(--terminal-green);
    color:var(--terminal-green);
    background:#020502;
    text-decoration:none;
    font-family:"Courier New",monospace;
    font-size:14px;
    font-weight:normal;
    text-shadow:0 0 3px var(--terminal-green);
}

.exit-button:hover{
    background:var(--terminal-green);
    color:#020502;
    text-shadow:none;
    box-shadow:0 0 8px var(--terminal-green-glow);
}

/* MOBILE */

@media(max-width:800px){

    .input-grid{
        grid-template-columns:1fr;
    }

    .section{
        padding:12px;
    }

    table{
        min-width:1000px;
    }

}

</style>

</head>

<body>

<div class="terminal">

    <div class="header">

        <div class="title">
            VAULT-TEC CARD LOT SEARCH
        </div>

        <div class="path">
            C:/VAULT-TEC/MTG_COLLECTION/CARD_LOT_SEARCH
        </div>

    </div>


    <div class="section">

        <div class="section-title">
            &gt; ADD CARD TO LOT
        </div>


        <div class="input-grid">

            <div>

                <label for="setInput">
                    SET
                </label>

                <select id="setInput">

                    <option value="">
                        SELECT SET
                    </option>

                    <option value="PIP">
                        PIP
                    </option>

                    <option value="SLD">
                        SLD
                    </option>

                    <option value="TPIP">
                        TPIP
                    </option>

                </select>

            </div>


            <div>

                <label for="numberInput">
                    CARD NUMBER
                </label>

                <input
                    id="numberInput"
                    type="text"
                    placeholder="ENTER NUMBER"
                >

            </div>


            <div>

                <label for="foilInput">
                    FOIL TYPE
                </label>

                <select id="foilInput">

                    <option value="">
                        SELECT FINISH
                    </option>

                    <option value="No Foil">
                        NO FOIL
                    </option>

                    <option value="Standard Foil">
                        STANDARD FOIL
                    </option>

                    <option value="Surge Foil">
                        SURGE FOIL
                    </option>

                    <option value="Rainbow Foil">
                        RAINBOW FOIL
                    </option>

                </select>

            </div>


            <div>

                <button
                    id="addButton"
                    type="button"
                >
                    ADD TO LOT
                </button>

            </div>

        </div>


        <div
            id="status"
            class="status"
        >
            &gt; READY
        </div>

    </div>


    <div class="section">

        <div class="section-title">
            &gt; CURRENT CARD LOT
        </div>


        <table>

            <thead>

                <tr>

                    <th>SET</th>
                    <th>NUMBER</th>
                    <th>VARIANT</th>
                    <th>NAME</th>
                    <th>COST</th>
                    <th>TYPE</th>
                    <th>RARITY</th>
                    <th>FINISH</th>
                    <th>VALUE</th>
                    <th>OWNERSHIP</th>
                    <th></th>

                </tr>

            </thead>


            <tbody id="lotTableBody">

            </tbody>

        </table>


        <div
            id="emptyMessage"
            class="status"
        >
            &gt; NO CARDS CURRENTLY ADDED
        </div>


        <div
            id="lotTotal"
            class="total"
            style="display:none;"
        >
        </div>

    </div>


    <a
        href="index.html"
        class="exit-button"
    >
        &gt; EXIT TO MAIN MENU
    </a>

</div>


<script>

let cards = [];

let lot = [];


/*
 * --------------------------------------------------------
 * LOAD CARDS.JSON
 * --------------------------------------------------------
 */

async function loadCards() {

    const status =
        document.getElementById("status");

    status.textContent =
        "> ACCESSING CARD DATABASE...";


    try {

        const response =
            await fetch("../data/cards.json");


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        cards =
            await response.json();


        status.textContent =
            "> DATABASE LOADED: " +
            cards.length +
            " CARD RECORDS";


    }

    catch (error) {

        console.error(error);

        status.textContent =
            "> ERROR: COULD NOT LOAD CARDS.JSON";

    }

}


/*
 * --------------------------------------------------------
 * FIND CARD
 * --------------------------------------------------------
 */

function findCard(set, number) {

    return cards.find(card => {

        return (
            String(card.set).trim() ===
            String(set).trim()

            &&

            String(card.number).trim() ===
            String(number).trim()
        );

    });

}


/*
 * --------------------------------------------------------
 * GET FINISH INFORMATION
 * --------------------------------------------------------
 */

function getFinishData(card, finish) {

    let ownershipKey;
    let valueKey;


    if (finish === "No Foil") {

        ownershipKey =
            "noFoil";

        valueKey =
            "noFoilValue";

    }

    else if (finish === "Standard Foil") {

        ownershipKey =
            "standardFoil";

        valueKey =
            "standardFoilValue";

    }

    else if (finish === "Surge Foil") {

        ownershipKey =
            "surgeFoil";

        valueKey =
            "surgeFoilValue";

    }

    else if (finish === "Rainbow Foil") {

        ownershipKey =
            "rainbowFoil";

        valueKey =
            "rainbowFoilValue";

    }

    else {

        return null;

    }


    return {

        ownership:
            card[ownershipKey],

        value:
            card[valueKey]

    };

}


/*
 * --------------------------------------------------------
 * ADD CARD
 * --------------------------------------------------------
 */

function addCardToLot() {

    const set =
        document.getElementById("setInput").value;

    const number =
        document.getElementById("numberInput").value.trim();

    const finish =
        document.getElementById("foilInput").value;


    if (!set || !number || !finish) {

        setStatus(
            "> ERROR: SET, NUMBER, AND FINISH REQUIRED"
        );

        return;

    }


    const card =
        findCard(set, number);


    if (!card) {

        setStatus(
            "> ERROR: CARD NOT FOUND"
        );

        return;

    }


    const finishData =
        getFinishData(card, finish);


    if (!finishData) {

        setStatus(
            "> ERROR: INVALID FINISH TYPE"
        );

        return;

    }


    if (
        finishData.ownership ===
        "Not Possible"
        ||

        finishData.ownership ===
        ""

        ||

        finishData.ownership ===
        null

    ) {

        setStatus(
            "> ERROR: THIS FINISH IS NOT POSSIBLE FOR THIS CARD"
        );

        return;

    }


    let value = "";


    if (
        finishData.value !== "" &&
        finishData.value !== null &&
        finishData.value !== undefined
    ) {

        const numericValue =
            Number(finishData.value);


        if (!isNaN(numericValue)) {

            value =
                numericValue;

        }

    }


    const lotEntry = {

        id:
            Date.now() +
            Math.random(),

        set:
            card.set,

        number:
            card.number,

        variant:
            card.variant,

        name:
            card.name,

        cost:
            card.cost,

        type:
            card.type,

        rarity:
            card.rarity,

        finish:
            finish,

        value:
            value,

        ownership:
            finishData.ownership

    };


    lot.push(lotEntry);


    renderLot();


    document
        .getElementById("numberInput")
        .value = "";


    setStatus(
        "> ADDED: " +
        card.name +
        " [" +
        card.set +
        " " +
        card.number +
        "]"
    );

}


/*
 * --------------------------------------------------------
 * REMOVE CARD
 * --------------------------------------------------------
 */

function removeCard(id) {

    lot =
        lot.filter(card => {

            return card.id !== id;

        });


    renderLot();

}


/*
 * --------------------------------------------------------
 * RENDER LOT
 * --------------------------------------------------------
 */

function renderLot() {

    const tbody =
        document.getElementById("lotTableBody");

    const emptyMessage =
        document.getElementById("emptyMessage");

    const lotTotal =
        document.getElementById("lotTotal");


    tbody.innerHTML = "";


    if (lot.length === 0) {

        emptyMessage.style.display =
            "block";

        lotTotal.style.display =
            "none";

        return;

    }


    emptyMessage.style.display =
        "none";


    let totalValue = 0;


    lot.forEach(card => {

        const row =
            document.createElement("tr");


        const valueText =
            card.value === ""
                ? "NO VALUE"
                : "$" +
                  Number(card.value).toFixed(2);


        if (card.value !== "") {

            totalValue +=
                Number(card.value);

        }


        row.innerHTML = `

            <td>${escapeHtml(card.set)}</td>

            <td>${escapeHtml(card.number)}</td>

            <td>${escapeHtml(card.variant)}</td>

            <td>${escapeHtml(card.name)}</td>

            <td>${escapeHtml(card.cost || "")}</td>

            <td>${escapeHtml(card.type || "")}</td>

            <td>${escapeHtml(card.rarity || "")}</td>

            <td>${escapeHtml(card.finish)}</td>

            <td>${valueText}</td>

            <td>${escapeHtml(card.ownership)}</td>

            <td>
                <button
                    class="remove-button"
                    onclick="removeCard(${card.id})"
                >
                    X
                </button>
            </td>

        `;


        tbody.appendChild(row);

    });


    lotTotal.style.display =
        "block";


    lotTotal.textContent =
        "> TOTAL TRACKED VALUE: $" +
        totalValue.toFixed(2);

}


/*
 * --------------------------------------------------------
 * STATUS
 * --------------------------------------------------------
 */

function setStatus(message) {

    document.getElementById(
        "status"
    ).textContent = message;

}


/*
 * --------------------------------------------------------
 * HTML ESCAPING
 * --------------------------------------------------------
 */

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/*
 * --------------------------------------------------------
 * ENTER KEY
 * --------------------------------------------------------
 */

document
    .getElementById("addButton")
    .addEventListener(
        "click",
        addCardToLot
    );


document
    .getElementById("numberInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                addCardToLot();

            }

        }
    );


/*
 * --------------------------------------------------------
 * START
 * --------------------------------------------------------
 */

loadCards();

</script>

</body>
</html>
