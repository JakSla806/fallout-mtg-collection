<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fallout MTG Collection</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 30px;
    background: #f5f5f5;
    color: #222;
}

h1 {
    margin: 0 0 5px 0;
}

#status {
    margin: 0 0 20px 0;
    color: #555;
}

.back-button {
    display: inline-block;
    margin-bottom: 15px;
    padding: 8px 14px;
    background: #ddd;
    color: #222;
    text-decoration: none;
    border: 1px solid #aaa;
    border-radius: 4px;
    font-size: 14px;
}

.back-button:hover {
    background: #ccc;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

.controls input,
.controls select {
    padding: 8px;
    font-size: 14px;
}

.controls input {
    width: 220px;
}

#cardGrid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 15px;
    width: 100%;
}

.card {
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 15px;
    min-width: 0;
}

.card:hover {
    background: #f0f0f0;
}

.card-header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
}

.card-name {
    font-size: 18px;
    font-weight: bold;
}

.card-number {
    color: #666;
    white-space: nowrap;
}

.card-details {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 12px;
    margin-bottom: 14px;
}

.detail-label {
    color: #777;
    font-weight: bold;
}

.detail-value {
    min-width: 0;
    overflow-wrap: anywhere;
}

.finishes {
    border-top: 1px solid #ddd;
    padding-top: 10px;
}

.finish-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    align-items: center;
    padding: 5px 0;
}

.finish-name {
    font-weight: bold;
}

.finish-price {
    text-align: right;
    min-width: 60px;
}

.owned {
    font-weight: bold;
}

.links {
    border-top: 1px solid #ddd;
    margin-top: 10px;
    padding-top: 10px;
}

.links a {
    margin-right: 12px;
}

@media (max-width: 900px) {

    #cardGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

}

@media (max-width: 600px) {

    body {
        margin: 15px;
    }

    #cardGrid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<h1>Fallout MTG Collection</h1>

<a href="../html" class="back-button">
    Back to Menu
</a>

<h1>Fallout MTG Collection</h1>

<p id="status">
    Loading card database...
</p>

<p id="lastPriceUpdate">
    Checking last price update...
</p>

<div class="controls">

<input
    type="text"
    id="searchInput"
    placeholder="Search card name..."
>
<select id="setFilter">
    <option value="">All Sets</option>
</select>

<select id="variantFilter">
    <option value="">All Variants</option>
</select>

<select id="rarityFilter">
    <option value="">All Rarities</option>
</select>

<select id="finishFilter">

    <option value="">
        All Finishes
    </option>

    <option value="No Foil">
        No Foil
    </option>

    <option value="Standard Foil">
        Standard Foil
    </option>

    <option value="Surge Foil">
        Surge Foil
    </option>

    <option value="Rainbow Foil">
        Rainbow Foil
    </option>

</select>

<select id="ownershipFilter">

    <option value="">
        All Ownership
    </option>

    <option value="Owned">
        Owned
    </option>

    <option value="Unowned">
        Unowned
    </option>

</select>

<select id="sortFilter">

    <option value="number">
        Sort: Number
    </option>

    <option value="name">
        Sort: Name
    </option>

    <option value="priceLow">
        Sort: Price Low to High
    </option>

    <option value="priceHigh">
        Sort: Price High to Low
    </option>

</select>

</div>

<div id="cardGrid"></div>

<script>

let cards = [];

const searchInput =
    document.getElementById("searchInput");

const setFilter =
    document.getElementById("setFilter");

const variantFilter =
    document.getElementById("variantFilter");

const rarityFilter =
    document.getElementById("rarityFilter");

const finishFilter =
    document.getElementById("finishFilter");

const ownershipFilter =
    document.getElementById("ownershipFilter");

const sortFilter =
    document.getElementById("sortFilter");

const cardGrid =
    document.getElementById("cardGrid");

const status =
    document.getElementById("status");

const lastPriceUpdate =
    document.getElementById("lastPriceUpdate");


fetch("../data/cards.json?" + Date.now())

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Could not load cards.json. HTTP " +
                response.status
            );

        }

        return response.json();

    })

    .then(data => {

        cards = data;

        populateFilters();

        renderCards();

    })

    .catch(error => {

        status.textContent =
            "ERROR: " + error.message;

        console.error(error);

    });


loadLastPriceUpdate();


function populateFilters() {

    const sets =
        [...new Set(
            cards
                .map(card => card.set)
                .filter(Boolean)
        )]
        .sort();


    const variants =
        [...new Set(
            cards
                .map(card => card.variant)
                .filter(Boolean)
        )]
        .sort();


    const rarities =
        [...new Set(
            cards
                .map(card => card.rarity)
                .filter(Boolean)
        )]
        .sort();


    sets.forEach(value => {

        const option =
            document.createElement("option");

        option.value = value;
        option.textContent = value;

        setFilter.appendChild(option);

    });


    variants.forEach(value => {

        const option =
            document.createElement("option");

        option.value = value;
        option.textContent = value;

        variantFilter.appendChild(option);

    });


    rarities.forEach(value => {

        const option =
            document.createElement("option");

        option.value = value;
        option.textContent = value;

        rarityFilter.appendChild(option);

    });

}


function getFinishData(card) {

    return [

        {
            name: "No Foil",
            ownership: card.noFoil,
            price: card.noFoilValue
        },

        {
            name: "Standard Foil",
            ownership: card.standardFoil,
            price: card.standardFoilValue
        },

        {
            name: "Surge Foil",
            ownership: card.surgeFoil,
            price: card.surgeFoilValue
        },

        {
            name: "Rainbow Foil",
            ownership: card.rainbowFoil,
            price: card.rainbowFoilValue
        }

    ];

}


function renderCards() {

    cardGrid.innerHTML = "";


    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    const selectedSet =
        setFilter.value;

    const selectedVariant =
        variantFilter.value;

    const selectedRarity =
        rarityFilter.value;

    const selectedFinish =
        finishFilter.value;

    const selectedOwnership =
        ownershipFilter.value;


    const results = [];


    cards.forEach(card => {

        if (
            search &&
            !String(card.name || "")
                .toLowerCase()
                .includes(search)
        ) {
            return;
        }


        if (
            selectedSet &&
            card.set !== selectedSet
        ) {
            return;
        }


        if (
            selectedVariant &&
            card.variant !== selectedVariant
        ) {
            return;
        }


        if (
            selectedRarity &&
            card.rarity !== selectedRarity
        ) {
            return;
        }


        getFinishData(card)
            .forEach(finish => {

                if (
                    finish.ownership ===
                    "Not Possible"
                ) {
                    return;
                }


                if (
                    selectedFinish &&
                    finish.name !==
                    selectedFinish
                ) {
                    return;
                }


                if (
                    selectedOwnership &&
                    finish.ownership !==
                    selectedOwnership
                ) {
                    return;
                }


                results.push({

                    card: card,

                    finish: finish.name,

                    ownership:
                        finish.ownership,

                    price:
                        finish.price

                });

            });

    });


    sortResults(results);


    const groupedCards =
        new Map();


    results.forEach(result => {

        if (
            !groupedCards.has(
                result.card
            )
        ) {

            groupedCards.set(
                result.card,
                []
            );

        }


        groupedCards
            .get(result.card)
            .push(result);

    });


    groupedCards.forEach(
        (finishes, card) => {

            const cardElement =
                document.createElement("div");

            cardElement.className =
                "card";


            let finishHtml = "";


            finishes.forEach(finish => {

                const price =
                    finish.price === "" ||
                    finish.price === null ||
                    finish.price === undefined
                        ? ""
                        : "$" +
                          Number(
                              finish.price
                          ).toFixed(2);


                const ownershipClass =
                    finish.ownership === "Owned"
                        ? "owned"
                        : "";


                finishHtml += `

                    <div class="finish-row">

                        <span class="finish-name">
                            ${escapeHtml(
                                finish.finish
                            )}
                        </span>

                        <span class="finish-price">
                            ${price}
                        </span>

                        <span class="${ownershipClass}">
                            ${escapeHtml(
                                finish.ownership
                            )}
                        </span>

                    </div>

                `;

            });


            cardElement.innerHTML = `

                <div class="card-header">

                    <div class="card-name">
                        ${escapeHtml(
                            card.name
                        )}
                    </div>

                    <div class="card-number">
                        ${escapeHtml(
                            card.set
                        )}
                        ${escapeHtml(
                            card.number
                        )}
                    </div>

                </div>


                <div class="card-details">

                    <div class="detail-label">
                        Mana Cost
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            card.cost
                        )}
                    </div>


                    <div class="detail-label">
                        Type
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            card.type
                        )}
                    </div>


                    <div class="detail-label">
                        Variant
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            card.variant
                        )}
                    </div>


                    <div class="detail-label">
                        Rarity
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            card.rarity
                        )}
                    </div>

                </div>


                <div class="finishes">
                    ${finishHtml}
                </div>


                <div class="links">

                    ${
                        card.numberLink
                            ? `<a
                                href="${card.numberLink}"
                                target="_blank"
                                rel="noopener noreferrer"
                               >
                                Scryfall
                               </a>`
                            : ""
                    }


                    ${
                        card.nameLink
                            ? `<a
                                href="${card.nameLink}"
                                target="_blank"
                                rel="noopener noreferrer"
                               >
                                TCGplayer
                               </a>`
                            : ""
                    }

                </div>

            `;


            cardGrid.appendChild(
                cardElement
            );

        }
    );


    status.textContent =
        "Showing " +
        results.length +
        " finishes from " +
        cards.length +
        " cards.";

}


function sortResults(results) {

    const sort =
        sortFilter.value;


    if (sort === "name") {

        results.sort((a, b) =>
            String(a.card.name || "")
                .localeCompare(
                    String(b.card.name || "")
                )
        );

    }

    else if (sort === "priceLow") {

        results.sort((a, b) =>
            Number(a.price || 0) -
            Number(b.price || 0)
        );

    }

    else if (sort === "priceHigh") {

        results.sort((a, b) =>
            Number(b.price || 0) -
            Number(a.price || 0)
        );

    }

    else {

        results.sort((a, b) => {

            const setCompare =
                String(a.card.set || "")
                    .localeCompare(
                        String(b.card.set || "")
                    );


            if (
                setCompare !== 0
            ) {
                return setCompare;
            }


            const numberA =
                parseFloat(
                    String(
                        a.card.number || ""
                    )
                );


            const numberB =
                parseFloat(
                    String(
                        b.card.number || ""
                    )
                );


            if (
                !Number.isNaN(numberA) &&
                !Number.isNaN(numberB)
            ) {

                return numberA - numberB;

            }


            return String(
                a.card.number || ""
            )
            .localeCompare(
                String(
                    b.card.number || ""
                )
            );

        });

    }

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


async function loadLastPriceUpdate() {

    try {

        const response =
            await fetch(
                "../data/price_update.json?" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "Could not load price update timestamp."
            );

        }


        const data =
            await response.json();


        if (!data.lastUpdated) {

            lastPriceUpdate.textContent =
                "Last price update: Unknown";

            return;

        }


        const date =
            new Date(
                data.lastUpdated
            );


        lastPriceUpdate.textContent =
            "Last price update: " +
            date.toLocaleString();

    }

    catch (error) {

        console.error(
            error
        );

        lastPriceUpdate.textContent =
            "Last price update: Unknown";

    }

}


searchInput.addEventListener(
    "input",
    renderCards
);

setFilter.addEventListener(
    "change",
    renderCards
);

variantFilter.addEventListener(
    "change",
    renderCards
);

rarityFilter.addEventListener(
    "change",
    renderCards
);

finishFilter.addEventListener(
    "change",
    renderCards
);

ownershipFilter.addEventListener(
    "change",
    renderCards
);

sortFilter.addEventListener(
    "change",
    renderCards
);

</script>

</body>
</html>
